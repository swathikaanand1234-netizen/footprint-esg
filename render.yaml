services:
  # Unified Full-Stack Web Service (Optimized for Render Free Tier)
  - type: web
    name: footprint-esg
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
