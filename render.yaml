services:
  # Backend API & Real-time Web Service
  - type: web
    name: footprint-esg-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: '*'

  # Frontend React Dashboard (Static Site)
  - type: static
    name: footprint-esg-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: footprint-esg-server
          property: host
